  {q:["what is pi","what is π","value of pi"],a:"π (pi) ≈ 3.14159265358979...\nThe ratio of a circle\'s circumference to its diameter. Irrational — it goes on forever without repeating."},
  {q:["what is euler number","what is e in math","eulers number"],a:"Euler\'s number e ≈ 2.71828182845...\nBase of natural logarithm. Appears in growth, decay, compound interest, and probability."},

  {q:["what is infinity","what is ∞"],a:"Infinity (∞) is not a number — it\'s a concept meaning without bound. You can always add 1 to any number. Mathematicians distinguish different \'sizes\' of infinity."},

  {q:["what is pemdas","order of operations","bodmas"],a:"Order of operations:\n1. Parentheses\n2. Exponents\n3. Multiplication & Division (left to right)\n4. Addition & Subtraction (left to right)\nMemonic: PEMDAS / BODMAS"},
  {q:["what is a vector in math"],a:"A vector has magnitude (size) and direction. In math: an ordered list of numbers. In physics: quantities like velocity, force, acceleration."},
  {q:["what is a derivative"],a:"A derivative measures instantaneous rate of change — the slope of a function at any point. If f(x) = x², then f\'(x) = 2x."},

  {q:["what is the speed of light"],a:"299,792,458 m/s — about 300,000 km/s. In 1 second light circles Earth 7.5 times. Nothing with mass can reach it."},
  {q:["what is energy in physics"],a:"Energy = capacity to do work. Forms: kinetic (motion), potential (position), thermal, electrical, chemical, nuclear. E=mc² shows mass and energy are equivalent."},

  {q:["what is thermodynamics"],a:"Study of heat and energy:\n• 1st law: energy conserved\n• 2nd law: entropy always increases\n• 3rd law: absolute zero unreachable"},
  {q:["what is electromagnetic radiation","what is light"],a:"EM radiation is energy as waves: radio, microwave, infrared, visible light, UV, X-rays, gamma rays — all the same thing at different frequencies."},
  {q:["what is pressure","atmospheric pressure"],a:"Pressure = Force/Area. Atmospheric pressure at sea level = 101,325 Pa (1 atm). Decreases with altitude."},
  {q:["what is an atom"],a:"Smallest unit of an element. Has nucleus (protons + neutrons) surrounded by electrons. Proton count = element identity."},
  {q:["what is a molecule"],a:"Two or more atoms bonded together. H₂O = 2 hydrogen + 1 oxygen. CO₂ = 1 carbon + 2 oxygen."},
  {q:["what is the periodic table"],a:"Chart of all 118 known elements organized by atomic number and properties. Created by Mendeleev in 1869."},
  {q:["what is hydrogen"],a:"Element 1 — lightest and most abundant element (75% of all normal matter). Stars run on hydrogen fusion."},
  {q:["what is oxygen"],a:"Element 8 — 21% of Earth\'s atmosphere. Essential for respiration. Highly reactive."},
  {q:["what is carbon"],a:"Element 6 — basis of all known life. Forms more compounds than any other element. Diamond and graphite are both pure carbon."},
  {q:["what is gold"],a:"Element 79 (Au) — dense, soft, yellow, doesn\'t rust. Used in jewelry, electronics. All gold ever mined would fit ~3.5 Olympic pools."},
  {q:["what is iron"],a:"Element 26 (Fe) — most common element by mass in Earth. Core of Earth is mostly iron. Essential for blood (hemoglobin)."},
  {q:["what is water","what is h2o"],a:"H₂O: 2 hydrogen + 1 oxygen. Covers 71% of Earth\'s surface. Essential for all life. Unique: expands when freezing."},
  {q:["what is co2","what is carbon dioxide"],a:"CO₂: 1 carbon + 2 oxygen. Produced by respiration/combustion. Absorbed by plants. The main greenhouse gas."},
  {q:["what is ph","ph scale"],a:"pH 0–14: below 7 = acidic, 7 = neutral (water), above 7 = alkaline. Lemon juice ~2, bleach ~13."},
  {q:["what is an acid"],a:"Releases H⁺ ions, pH < 7, tastes sour. Examples: HCl, H₂SO₄, vinegar (acetic acid)."},
  {q:["what is a base","what is alkali"],a:"Accepts H⁺ ions, pH > 7, feels slippery. Examples: NaOH (lye), baking soda, ammonia."},
  {q:["what is radioactivity","radioactive decay"],a:"Spontaneous emission from unstable atomic nuclei. Types: alpha, beta, gamma. Used in medicine, power, and carbon-14 dating."},
  {q:["what is a chemical reaction"],a:"Reactants transform into products by breaking/forming chemical bonds. Signs: color change, gas, heat, light, precipitate."},
  {q:["what is nuclear fission"],a:"Splitting heavy atomic nuclei (uranium, plutonium) releasing enormous energy. Used in nuclear power plants and atomic bombs."},
  {q:["what is nuclear fusion"],a:"Combining light nuclei (hydrogen → helium) releasing even more energy than fission. Powers the sun. ITER project attempting it on Earth."},
  {q:["what is photosynthesis"],a:"6CO₂ + 6H₂O + sunlight → C₆H₁₂O₆ + 6O₂\nPlants convert sunlight + CO₂ + water into glucose and oxygen."},
  {q:["what is dna","what is dna?"],a:"DNA (Deoxyribonucleic Acid) = double-helix molecule carrying genetic instructions. 4 bases: A, T, G, C. Human genome: ~3 billion base pairs, ~20,000 genes."},
  {q:["what is a cell","what is a cell in biology"],a:"Basic unit of life. Prokaryotic (bacteria — no nucleus) or eukaryotic (plants/animals — has nucleus). Parts: nucleus, mitochondria, cell membrane, ribosomes."},
  {q:["what is evolution"],a:"Change in species over generations via natural selection, mutation, genetic drift, sexual selection. All life shares a common ancestor ~3.8 billion years ago."},
  {q:["what is genetics"],a:"Study of genes, heredity, and variation. You inherit ~half your DNA from each parent. Dominant genes mask recessive ones (Mendel\'s laws)."},
  {q:["what is a gene"],a:"DNA segment coding for a specific protein. Humans have ~20,000 genes. Determine traits from eye color to disease risk."},
  {q:["what is a virus"],a:"Non-living infectious agent — protein coat containing DNA or RNA. Hijacks host cells to replicate. Examples: flu, COVID-19, HIV."},
  {q:["what is bacteria","what is a bacterium"],a:"Single-celled prokaryotes. Most are harmless or beneficial (gut microbiome). Some cause disease. Antibiotics target bacteria, not viruses."},
  {q:["what is the immune system"],a:"Body\'s defense:\n• Physical barriers (skin, mucus)\n• Innate immunity (fast, general)\n• Adaptive immunity (antibodies, memory T/B cells)\nVaccines train it to recognize specific pathogens."},
  {q:["what is a vaccine","how do vaccines work"],a:"Exposes immune system to harmless pathogen version (dead/weakened/protein). Body builds memory cells for fast future defense."},
  {q:["what is mitosis"],a:"Cell division for growth/repair — one cell → two identical daughter cells. Stages: Prophase, Metaphase, Anaphase, Telophase."},
  {q:["what is meiosis"],a:"Produces sex cells (sperm/eggs) with half normal chromosome count. Creates genetic diversity when egg + sperm combine."},
  {q:["what is an ecosystem"],a:"Community of organisms interacting with their environment. Energy flows: producer → consumer → decomposer. Examples: forest, coral reef, savanna."},
  {q:["what is biodiversity"],a:"Variety of life — species, genetic, and ecosystem diversity. Currently in 6th mass extinction driven by humans."},
  {q:["what is a chromosome"],a:"DNA packed around proteins (histones). Humans have 46 chromosomes (23 pairs). Sex: XX = female, XY = male."},
  {q:["what is crispr","gene editing"],a:"CRISPR-Cas9 = molecular \'scissors\' that precisely cut and modify DNA. Treats genetic diseases, engineers crops. Nobel Prize 2020."},
  {q:["what is cloning"],a:"Creating genetically identical copies. Dolly the sheep (1996): first cloned mammal from adult cell. Therapeutic cloning grows tissue for medicine."},
  {q:["what is stem cells"],a:"Undifferentiated cells that can become specialized types. Embryonic: can become any cell. Used in medical research and therapy."},
  {q:["what is respiration"],a:"Cellular respiration: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ATP (energy). Opposite of photosynthesis. Happens in mitochondria."},
  {q:["how many planets are in the solar system","how many planets"],a:"8 planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.\nPluto reclassified as dwarf planet in 2006."},
  {q:["what is the sun","facts about the sun"],a:"G-type star: 4.6 billion years old, 5,500°C surface, 15 million°C core, 73% hydrogen, 25% helium. Light takes 8 min 20 sec to reach Earth."},
  {q:["what is mercury the planet"],a:"Smallest planet, closest to sun. 430°C day, -180°C night. No atmosphere, no moons. Year = 88 Earth days."},
  {q:["what is venus","venus planet facts"],a:"Earth\'s twin in size but hellish: 465°C surface, 90× Earth\'s atmospheric pressure, clouds of sulfuric acid. Hottest planet despite not being closest to sun."},
  {q:["what is mars","mars planet facts"],a:"Red Planet: thin CO₂ atmosphere, rust-covered surface, tallest volcano in solar system (Olympus Mons, 22km). Day ≈ 24.6 hours. Has multiple rovers."},
  {q:["what is jupiter","jupiter facts"],a:"Largest planet: 11× Earth\'s diameter. 95 moons. Giant Red Spot storm lasting 350+ years. Europa moon may have subsurface ocean."},
  {q:["what is saturn","saturn facts"],a:"Famous for ring system of ice and rock. 146 moons. Titan has atmosphere and liquid methane lakes. Least dense planet — floats on water."},
  {q:["what is uranus"],a:"Ice giant rotating on its side (98° tilt). Methane atmosphere gives blue-green color. Average: -195°C."},
  {q:["what is neptune"],a:"Farthest planet. Fastest winds in solar system (2,100 km/h). 16 moons. 1 Neptune year = 165 Earth years."},
  {q:["what is the moon","facts about the moon"],a:"Earth\'s only natural satellite. 384,400 km away. 1/6th Earth\'s gravity. Formed ~4.5 billion years ago from giant impact. 12 humans walked on it (1969–1972)."},
  {q:["how far is the moon","distance to the moon"],a:"~384,400 km (238,855 miles) on average. Light takes 1.3 seconds to travel there."},
  {q:["how far is the sun","distance to the sun"],a:"~150 million km (93 million miles) = 1 Astronomical Unit (AU). Light takes ~8 min 20 sec."},
  {q:["what is a light year"],a:"Distance light travels in one year ≈ 9.461 trillion km (5.879 trillion miles). Proxima Centauri is 4.24 light years away."},
  {q:["what is a nebula"],a:"Cloud of gas and dust in space — birthplace of stars. Famous: Orion Nebula, Pillars of Creation, Crab Nebula."},
  {q:["what is a neutron star"],a:"Collapsed core of a massive star. Incredibly dense — 1 teaspoon weighs ~1 billion tons. Diameter ~20 km, mass > sun\'s."},
  {q:["what is a supernova"],a:"Massive stellar explosion — among the most energetic events in the universe. Creates and distributes heavy elements like gold and iron."},
  {q:["what is the big bang","big bang theory"],a:"~13.8 billion years ago, all matter/energy exploded from a hot, dense point and has been expanding ever since."},
  {q:["what is the milky way"],a:"Our home galaxy: barred spiral, 100–400 billion stars, 100,000 light-years across. Supermassive black hole Sagittarius A* at center."},
  {q:["how many galaxies are there"],a:"Estimated ~2 trillion galaxies in the observable universe, each with billions to trillions of stars."},
  {q:["how old is the universe"],a:"~13.8 billion years old — calculated from cosmic microwave background radiation and expansion rate."},
  {q:["what is an asteroid"],a:"Rocky body orbiting the sun, mostly in the asteroid belt between Mars and Jupiter. The one that killed the dinosaurs was ~10 km wide."},
  {q:["what is a comet"],a:"Icy body developing a glowing tail when near the sun. Halley\'s Comet appears every ~75 years. Next: 2061."},
  {q:["what is the iss","what is the international space station"],a:"Habitable space station orbiting ~400 km above Earth. Continuously inhabited since 2000. Travels at 7.7 km/s, orbiting every 90 minutes."},
  {q:["will humans go to mars","mars mission"],a:"NASA and SpaceX plan Mars missions for the 2030s. Challenges: 6–9 month journey, radiation, life support, landing. Closer than ever!"},
  {q:["what is pluto","is pluto a planet"],a:"Pluto was reclassified as a dwarf planet by the IAU in 2006 — too small to clear its orbital neighborhood. Diameter: 2,377 km. Has 5 moons; largest: Charon."},
  {q:["what is a galaxy"],a:"A gravitationally bound system of stars, gas, dust, and dark matter. Types: spiral (Milky Way, Andromeda), elliptical, irregular. Billions exist in the universe."},

  {q:["what is the amazon rainforest"],a:"World\'s largest tropical rainforest: 5.5 million km² mainly in Brazil. Produces ~20% of Earth\'s oxygen, hosts ~10% of all species."},

  {q:["what is the dead sea"],a:"Lowest point on Earth\'s surface: 430 m below sea level. So salty (~34%) you float effortlessly. Israel/Jordan border."},
  {q:["what is the nile river"],a:"~6,650 km, flows north through 11 African countries to Mediterranean. Ancient Egyptian civilization depended on its annual floods."},

  {q:["what are the great lakes"],a:"5 Great Lakes between USA and Canada: Superior (largest freshwater lake by area), Michigan, Huron, Erie, Ontario. SMHOE to remember."},

  {q:["when did ww2 end","when did world war 2 end"],a:"WW2 ended:\n• Europe (V-E Day): May 8, 1945\n• Pacific (V-J Day): September 2, 1945\nKilled ~70–85 million people — deadliest conflict in history."},
  {q:["when did ww2 start","when did world war 2 start"],a:"September 1, 1939 — Nazi Germany invaded Poland. Britain and France declared war September 3."},
  {q:["when did ww1 end","when did world war 1 end"],a:"November 11, 1918 — the Armistice at 11am. 'The 11th hour of the 11th day of the 11th month.'"},
  {q:["when did ww1 start","when did world war 1 start"],a:"July 28, 1914 — following assassination of Archduke Franz Ferdinand on June 28 in Sarajevo."},
  {q:["who was the first president of the usa"],a:"George Washington (1732–1799). Served 1789–1797. Set precedent by voluntarily leaving after 2 terms."},
  {q:["when did the titanic sink"],a:"April 15, 1912 at 2:20 AM. Hit iceberg at 11:40 PM April 14. ~1,517 of ~2,224 people died."},
  {q:["who invented the telephone"],a:"Alexander Graham Bell received the first US patent March 7, 1876. Italian Antonio Meucci invented a similar device earlier but didn't patent it in time."},
  {q:["who invented the light bulb"],a:"Thomas Edison (1879) patented the practical incandescent bulb. Humphry Davy and Joseph Swan also made contributions."},
  {q:["when did man first land on the moon"],a:"July 20, 1969. Neil Armstrong stepped out at 10:56 PM EDT: 'One small step for man, one giant leap for mankind.' Buzz Aldrin followed. Michael Collins orbited above."},
  {q:["who was napoleon","napoleon bonaparte"],a:"Napoleon Bonaparte (1769–1821) — French military genius and Emperor. Conquered most of Europe. Defeated at Waterloo (1815), exiled to Saint Helena."},
  {q:["what was the roman empire"],a:"Roman Empire (27 BC – 476 AD West, 1453 East). At peak: ~5 million km². Left lasting legacy in law, language, architecture, governance."},
  {q:["what caused world war 1"],a:"MAIN causes:\n• Militarism\n• Alliance system (Triple Alliance vs Triple Entente)\n• Imperialism\n• Nationalism (especially Balkans)\nSpark: Franz Ferdinand assassination."},
  {q:["what was the cold war"],a:"1947–1991: USA (capitalism) vs USSR (communism). Proxy wars (Korea, Vietnam), arms race, space race. Ended with Soviet collapse 1991."},
  {q:["when did the berlin wall fall"],a:"November 9, 1989. Symbolized end of Cold War. Germany reunified October 3, 1990."},
  {q:["who was albert einstein"],a:"Albert Einstein (1879–1955) — developed Special Relativity (1905) and General Relativity (1915). Nobel Prize 1921. E=mc²."},
  {q:["who was cleopatra"],a:"Cleopatra VII (69–30 BC) — last active ruler of Egypt. Spoke 9 languages. Allied with Julius Caesar and Mark Antony. Died by suicide."},
  {q:["what was the renaissance"],a:"14th–17th century cultural rebirth in Italy, then Europe. Key figures: Leonardo da Vinci, Michelangelo, Galileo, Raphael."},
  {q:["what was the industrial revolution"],a:"Late 1700s–1800s: agricultural → industrial society. Started in Britain with steam power. Urbanization, modern capitalism, pollution followed."},
  {q:["what was the french revolution"],a:"1789–1799: French monarchy overthrown. Storming of Bastille, execution of Louis XVI and Marie Antoinette, Reign of Terror. Led to Napoleon."},
  {q:["what was the american revolution"],a:"1775–1783: 13 colonies vs Britain. Declaration of Independence: July 4, 1776. Treaty of Paris (1783) recognized USA independence."},
  {q:["what was the russian revolution"],a:"1917: Two revolutions. February ousted Tsar Nicholas II. October (Bolsheviks/Lenin) established first communist state → USSR (1922)."},
  {q:["what was the holocaust"],a:"Nazi Germany's genocide of 6 million Jews and millions of others (Roma, disabled, LGBTQ+). Carried out in concentration and extermination camps 1941–1945."},
  {q:["who was nelson mandela"],a:"Nelson Mandela (1918–2013) — anti-apartheid leader. Imprisoned 27 years. First democratically elected South African president (1994). Nobel Peace Prize 1993."},
  {q:["what was apartheid"],a:"South Africa's system of racial segregation (1948–1994). Black citizens denied rights by law. Ended through international pressure and internal resistance."},
  {q:["who was julius caesar"],a:"Gaius Julius Caesar (100–44 BC) — Roman general, dictator. Conquered Gaul, crossed the Rubicon. Assassinated March 15, 44 BC by senators including Brutus."},
  {q:["what was the mongol empire"],a:"Largest contiguous land empire in history (1206–1368). Founded by Genghis Khan. Stretched from China to Eastern Europe."},
  {q:["who was genghis khan"],a:"Temüjin (1162–1227) — united Mongol tribes, founded Mongol Empire. Military genius, responsible for tens of millions of deaths but also enabled Silk Road trade."},
  {q:["who was christopher columbus"],a:"Christopher Columbus (1451–1506) — Italian explorer sailing for Spain. Reached Caribbean in 1492, initiating sustained European contact with the Americas."},
  {q:["who was martin luther king jr"],a:"Dr. MLK Jr. (1929–1968) — civil rights leader. Led nonviolent protests. 'I Have a Dream' speech 1963. Nobel Peace Prize 1964. Assassinated April 4, 1968."},
  {q:["when was the american civil war","american civil war"],a:"1861–1865. Union (North) vs. Confederacy (South) over slavery and states' rights. ~620,000–750,000 soldiers died."},
  {q:["who was winston churchill"],a:"Sir Winston Churchill (1874–1965) — British PM during WW2 (1940–45). Rallied Britain against Nazis. Nobel Prize in Literature 1953."},
  {q:["what was the magna carta"],a:"Signed 1215 by King John of England. Limited royal power, established due process. Foundation of constitutional democracy."},
  {q:["who was alexander the great"],a:"Alexander III of Macedon (356–323 BC) — conquered from Greece to Egypt to India by age 30. Undefeated in battle. Spread Greek culture (Hellenism)."},
  {q:["who was mahatma gandhi"],a:"Mohandas Gandhi (1869–1948) — led India's independence movement from British rule through nonviolent civil disobedience. Assassinated January 30, 1948."},
  {q:["when did india gain independence"],a:"August 15, 1947 — India gained independence from Britain, partitioned into India and Pakistan."},
  {q:["who was mao zedong"],a:"Mao Zedong (1893–1976) — founded People's Republic of China in 1949. Led Communist Party. Great Leap Forward and Cultural Revolution caused millions of deaths."},
  {q:["who was fidel castro"],a:"Fidel Castro (1926–2016) — led Cuban Revolution (1959), ruled Cuba for nearly 50 years as communist dictator. Survived hundreds of CIA assassination attempts."},
  {q:["what was vietnam war"],a:"1955–1975: North Vietnam (communist) vs South Vietnam (US-backed). US involvement 1965–1973. ~58,000 American and ~2 million Vietnamese died. North Vietnam won."},
  {q:["what was the korean war"],a:"1950–1953: North Korea (Soviet/Chinese-backed) vs South Korea (US/UN-backed). Ended in armistice — technically still ongoing. Divided Korea at 38th parallel."},
  {q:["who was joseph stalin"],a:"Joseph Stalin (1878–1953) — Soviet dictator 1924–1953. Industrialized USSR rapidly, won WW2, but killed millions in purges, gulags, and engineered famines."},
  {q:["who was adolf hitler"],a:"Adolf Hitler (1889–1945) — German dictator, leader of Nazi Party. Started WW2, responsible for the Holocaust and deaths of ~70-85 million people. Died by suicide April 30, 1945."},
  {q:["what was d-day"],a:"D-Day: June 6, 1944 — Allied invasion of Normandy, France. Largest seaborne invasion in history. ~156,000 Allied troops landed. Turned tide of WW2 in Western Europe."},
  {q:["who invented the printing press"],a:"Johannes Gutenberg (~1440) invented the movable-type printing press. Enabled mass production of books, sparked the Protestant Reformation, Renaissance, and Scientific Revolution."},
  {q:["who was isaac newton"],a:"Sir Isaac Newton (1643–1727) — discovered laws of motion, gravity, developed calculus, optics. Principia Mathematica (1687) is one of the most important scientific works ever."},
  {q:["who was galileo"],a:"Galileo Galilei (1564–1642) — Italian astronomer, physicist. Confirmed heliocentrism (sun is center), invented improved telescope, studied motion. Persecuted by Catholic Church."},
  {q:["what was the black death","what was the plague"],a:"The Black Death (1347–1351) was bubonic plague that killed 30–60% of Europe's population (~50 million people). Caused by bacterium Yersinia pestis, spread by fleas on rats."},
  {q:["who was thomas jefferson"],a:"Thomas Jefferson (1743–1826) — 3rd US President, primary author of the Declaration of Independence, founded University of Virginia."},
  {q:["who was abraham lincoln"],a:"Abraham Lincoln (1809–1865) — 16th US President. Led Union through Civil War, issued Emancipation Proclamation ending slavery. Assassinated April 14, 1865."},
  {q:["who was queen victoria"],a:"Queen Victoria (1819–1901) — longest reigning British monarch of her era (63 years). Her reign = British Empire at its peak, covering 25% of world's land."},
  {q:["what were the crusades"],a:"Religious wars (1095–1291) launched by European Christians to reclaim the Holy Land from Muslim rule. 7+ major Crusades. Left lasting religious and cultural divisions."},
  {q:["what is artificial intelligence","what is ai"],a:"AI = machines simulating human intelligence: learning, reasoning, problem-solving, language. Types: Narrow AI (specific tasks), General AI (human-level, not yet achieved), Superintelligence (hypothetical)."},
  {q:["what is machine learning"],a:"AI subset where systems learn patterns from data rather than explicit programming. Powers: recommendations, fraud detection, image recognition, language models."},
  {q:["what is deep learning"],a:"Uses neural networks with many layers to learn complex patterns. Behind: speech recognition, image classification, translation, ChatGPT."},
  {q:["what is chatgpt"],a:"AI chatbot by OpenAI on GPT models. Launched November 2022. Reached 100 million users in 2 months (fastest product ever). Generates human-like text."},
  {q:["what is the internet"],a:"Global network of billions of connected devices via TCP/IP protocols. Started as ARPANET (US military, 1969). Tim Berners-Lee invented World Wide Web 1989."},
  {q:["what is blockchain"],a:"Distributed ledger where data is in linked \'blocks\' across many computers. No single controller. Transparent, tamper-resistant. Foundation of cryptocurrency."},
  {q:["what is bitcoin"],a:"First cryptocurrency, created by Satoshi Nakamoto, launched January 3, 2009. Decentralized, blockchain-based, limited to 21 million coins."},
  {q:["what is cryptocurrency","what is crypto"],a:"Digital currency using cryptography, operating on decentralized blockchain networks. Examples: Bitcoin (BTC), Ethereum (ETH), Solana (SOL)."},
  {q:["what is ethereum"],a:"Second-largest cryptocurrency by Vitalik Buterin (2015). Programmable blockchain supporting smart contracts and decentralized apps."},
  {q:["what is python"],a:"High-level language by Guido van Rossum (1991). Clean syntax. Used in AI/ML, data science, web (Django/Flask), automation. Best first language."},
  {q:["what is javascript"],a:"Language of the web. Runs in browsers (front-end) and servers via Node.js (back-end). Created by Brendan Eich in 10 days (1995). Most used language globally."},
  {q:["what is typescript"],a:"JavaScript + static types by Microsoft (2012). Catches errors at compile time. Used for large-scale web apps. Compiles to JavaScript."},
  {q:["what is react"],a:"JavaScript UI library by Facebook/Meta (2013). Component-based. Powers: Facebook, Instagram, Airbnb. Uses virtual DOM."},
  {q:["what is html"],a:"HyperText Markup Language — structure of web pages. Tags: <h1>, <p>, <div>, <img>. Not a programming language — a markup language."},
  {q:["what is css"],a:"Cascading Style Sheets — visual presentation of HTML. Colors, fonts, layout, animation. Works with HTML and JS to create web experiences."},
  {q:["what is sql"],a:"Structured Query Language — manages relational databases.\n\nSELECT * FROM users WHERE age > 18;\n\nCreated 1974. Used in MySQL, PostgreSQL, SQLite."},
  {q:["what is nosql"],a:"Non-relational databases: documents (MongoDB), key-value (Redis), column (Cassandra), graph (Neo4j). Better for flexible, high-scale data."},
  {q:["what is a cpu"],a:"Central Processing Unit — brain of a computer. Executes instructions. Key metrics: cores, clock speed (GHz), cache. Modern: Intel Core i9, AMD Ryzen, Apple M-series."},
  {q:["what is a gpu"],a:"Graphics Processing Unit — massively parallel processor. Originally for graphics; now powers AI/ML, crypto mining. NVIDIA dominates AI GPU market."},
  {q:["what is ram"],a:"Random Access Memory — short-term computer memory. Faster than storage. More RAM = smoother multitasking. Volatile: cleared when powered off."},
  {q:["what is the cloud","what is cloud computing"],a:"IT resources (servers, storage, software) delivered over internet. Pay-as-you-go. Major providers: AWS (Amazon), Azure (Microsoft), Google Cloud."},
  {q:["what is cybersecurity"],a:"Protecting systems, networks, and data from digital attacks. Threats: malware, phishing, ransomware, DDoS. Growing critical infrastructure."},
  {q:["what is 5g"],a:"5th generation mobile network: 10 Gbps speeds, <1ms latency, massive connectivity. Enables autonomous vehicles, smart cities, IoT at scale."},
  {q:["what is iot","internet of things"],a:"Network of physical devices with sensors and connectivity. Smart home devices, wearables, industrial sensors. Billions of connected \'things\' sharing data."},
  {q:["what is vr","virtual reality"],a:"Computer-generated 3D environment via headset (Meta Quest, PlayStation VR). Fully immersive. Used in gaming, training, therapy, education."},
  {q:["what is ar","augmented reality"],a:"Digital content overlaid on the real world: Pokémon GO, IKEA Place, Snapchat filters, Apple Vision Pro."},
  {q:["what is quantum computing"],a:"Computers using qubits (superposition + entanglement). Can solve certain problems exponentially faster than classical computers. Still early stage."},
  {q:["what is an algorithm"],a:"Step-by-step instructions to solve a problem. Every piece of software runs on algorithms. Key types: sorting, searching, machine learning."},
  {q:["what is open source"],a:"Software with source code freely available to use, modify, distribute. Examples: Linux, Python, React, VS Code, Firefox."},
  {q:["what is linux"],a:"Free, open-source OS kernel by Linus Torvalds (1991). Powers: Android phones, most web servers, supercomputers. Distributions: Ubuntu, Fedora, Debian."},
  {q:["what is git"],a:"Distributed version control by Linus Torvalds (2005). Tracks code changes, enables collaboration. Key commands: clone, commit, push, pull, branch, merge."},
  {q:["what is docker"],a:"Packages apps and dependencies into portable containers. Revolutionized deployment. Pairs with Kubernetes for container orchestration at scale."},
  {q:["what is an api","what is api"],a:"Application Programming Interface = rules for software-to-software communication. You use APIs daily: Google Maps in apps, Stripe payments, login with Google."},
  {q:["hello world python","how to print python"],a:"print(\"Hello, World!\")"},
  {q:["hello world javascript","console log"],a:"console.log(\"Hello, World!\");"},
  {q:["hello world java"],a:"public class Main {\n  public static void main(String[] args) {\n    System.out.println(\"Hello, World!\");\n  }\n}"},
  {q:["hello world c++","hello world cpp"],a:"#include <iostream>\nusing namespace std;\nint main() {\n  cout << \"Hello, World!\" << endl;\n  return 0;\n}"},
  {q:["hello world html"],a:"<!DOCTYPE html>\n<html><body>\n  <h1>Hello, World!</h1>\n</body></html>"},
  {q:["how to make for loop in python","python for loop"],a:"for i in range(10):\n    print(i)\n\n# Loop over list:\nfruits = [\"apple\",\"banana\"]\nfor f in fruits:\n    print(f)"},
  {q:["how to make for loop in javascript","javascript for loop"],a:"for (let i = 0; i < 10; i++) {\n  console.log(i);\n}\n// Modern:\n[1,2,3].forEach(n => console.log(n));"},
  {q:["what is a variable in programming"],a:"Named container for a value:\n# Python:\nname = \"Madfire\"\nage = 100\n\n// JavaScript:\nlet name = \"Madfire\";\nconst PI = 3.14;"},
  {q:["what is a function in programming"],a:"Reusable block of code:\n# Python:\ndef greet(name):\n    return f\"Hello, {name}!\"\n\nprint(greet(\"World\"))"},
  {q:["what is an array","what is a list in programming"],a:"Ordered collection:\n# Python:\nnums = [1, 2, 3, 4, 5]\nnums[0]  # 1 (first item)\n\n// JS:\nconst nums = [1, 2, 3];\nnums[0]; // 1"},
  {q:["what is a dictionary in python","python dict"],a:"Key-value pairs:\nperson = {\n    \"name\": \"Madfire\",\n    \"age\": 100\n}\nprint(person[\"name\"])  # Madfire"},
  {q:["what is object oriented programming","what is oop"],a:"OOP organizes code into objects. 4 pillars:\n• Encapsulation (hide internal details)\n• Abstraction (show only what\'s needed)\n• Inheritance (child gets parent features)\n• Polymorphism (same interface, different behavior)"},
  {q:["what is recursion"],a:"A function calling itself:\ndef factorial(n):\n    if n <= 1: return 1\n    return n * factorial(n-1)\n\nfactorial(5)  # 120\n\nMust have base case!"},
  {q:["what is a while loop"],a:"Repeats while condition is true:\ni = 0\nwhile i < 5:\n    print(i)\n    i += 1\n\nWarning: must eventually become False or infinite loop!"},
  {q:["what is an if statement"],a:"Controls flow:\nage = 18\nif age >= 18:\n    print(\"Adult\")\nelif age >= 13:\n    print(\"Teen\")\nelse:\n    print(\"Child\")"},
  {q:["what is a boolean"],a:"True or False (1 or 0):\nis_raining = True\nif is_raining:\n    print(\"Get wet!\")"},
  {q:["what is null","what is none","what is undefined"],a:"Represents absence of value. Python: None. JavaScript: null and undefined. Always check for null before using it — common bug source."},
  {q:["what is big o notation","what is time complexity"],a:"Algorithm efficiency as input grows:\n• O(1): constant (hash lookup)\n• O(log n): logarithmic (binary search)\n• O(n): linear (simple loop)\n• O(n²): quadratic (nested loops)\n• O(2ⁿ): exponential (avoid!)"},
  {q:["what is the best programming language"],a:"Depends on goal:\n• Beginner → Python\n• Web front-end → JavaScript\n• AI/ML → Python\n• Mobile → Swift/Kotlin\n• Systems → Rust/C++\n• Data → Python/R/SQL\n• Enterprise → Java/C#"},
  {q:["how many bones in the human body"],a:"Adults: 206 bones. Babies: ~270–300 (many fuse). Smallest: stapes in ear (3mm). Longest: femur (thigh, ~50cm)."},
  {q:["how many muscles in the human body"],a:"600+ named muscles — ~40% of body weight. 3 types: skeletal (voluntary), smooth (organs), cardiac (heart)."},
  {q:["what is the human heart"],a:"Fist-sized pump. Beats ~100,000 times/day. Pumps ~5 liters/minute. 4 chambers: 2 atria, 2 ventricles."},
  {q:["how much water should i drink"],a:"2–3 liters (8–12 cups) daily. Pale yellow urine = well hydrated. Dark urine = drink more."},
  {q:["what is the immune system"],a:"Body\'s defense:\n• Skin, mucus, stomach acid (barriers)\n• Innate immunity (fast, general)\n• Adaptive immunity (antibodies, memory cells)\n• Vaccines train it to recognize specific pathogens"},
  {q:["what is a calorie"],a:"Unit of energy food provides. Average adult needs ~2,000–2,500 kcal/day. Protein/carbs: 4 kcal/g. Fat: 9 kcal/g. Alcohol: 7 kcal/g."},
  {q:["why do we sleep"],a:"Sleep functions:\n• Memory consolidation\n• Brain waste clearance\n• Hormone regulation\n• Immune function\n• Cellular repair\nAdults need 7–9 hours."},
  {q:["what is blood pressure"],a:"Systolic/Diastolic (e.g. 120/80 mmHg). Normal: <120/80. High: >130/80. Low: <90/60. Often no symptoms — \'silent killer.\'"},
  {q:["what is diabetes"],a:"Type 1: autoimmune (insulin needed). Type 2: insulin resistance (lifestyle-related). Both: high blood sugar damages organs over time."},
  {q:["what is cancer"],a:"Uncontrolled cell division from DNA mutations. Causes: genetics, carcinogens, viruses, random errors. Treatments: surgery, chemo, radiation, immunotherapy."},
  {q:["what vitamins do i need","what are vitamins"],a:"Essential:\n• A (vision, immunity)\n• B complex (energy, brain)\n• C (immune, collagen)\n• D (bones, immunity — sunlight)\n• E (antioxidant)\n• K (blood clotting)"},
  {q:["what is mental health"],a:"Emotional, psychological, and social wellbeing. Affects thoughts, feelings, actions. Common disorders: depression, anxiety, PTSD, OCD. Highly treatable. Seeking help is strength."},
  {q:["what is depression"],a:"Mood disorder: persistent sadness, loss of interest, fatigue, worthlessness. Not just \'feeling sad\' — a medical condition with biological components. Treatable with therapy and/or medication."},
  {q:["what is anxiety"],a:"Persistent excessive worry/fear interfering with daily life. Types: GAD, panic disorder, social anxiety, phobias. Treatable with CBT and/or medication."},
  {q:["how do i reduce stress"],a:"Evidence-based:\n• Exercise (endorphins)\n• Meditation/mindfulness\n• Adequate sleep\n• Social connection\n• Time in nature\n• Journaling\n• Professional support"},
  {q:["what is meditation"],a:"Focused attention training. Regular practice: reduces anxiety, improves focus, lowers blood pressure, changes brain structure. Even 10 min/day helps."},
  {q:["how much exercise do i need"],a:"WHO guidelines:\n• 150–300 min moderate aerobic/week\n• OR 75–150 min vigorous/week\n• Plus strength training 2+ days/week\nAny movement is better than none."},
  {q:["what is cholesterol"],a:"LDL (\'bad\'): deposits in arteries. HDL (\'good\'): removes cholesterol. Total should be <200 mg/dL. Diet, exercise, and statins help manage."},
  {q:["what is a heart attack"],a:"Myocardial infarction: blocked artery cuts blood to heart muscle. Symptoms: chest pain, shortness of breath, left arm/jaw pain. Medical emergency — call 911!"},
  {q:["what is a stroke"],a:"Blood supply cut to brain (ischemic, 87%) or vessel bursts (hemorrhagic). FAST: Face drooping, Arm weakness, Speech difficulty, Time to call emergency."},
  {q:["what is obesity","what is bmi"],a:"BMI ≥ 30 = obese. BMI = weight(kg)/height(m)². Increases risk of diabetes, heart disease, stroke, cancer. Caused by diet, inactivity, genetics, hormones."},
  {q:["what is intermittent fasting"],a:"Cycling eating/fasting periods. 16:8 (fast 16 hours, eat in 8-hour window) most popular. Benefits: weight loss, insulin sensitivity, cellular repair (autophagy)."},
  {q:["how to build muscle"],a:"Requires:\n1. Progressive overload (more weight/reps)\n2. Protein: 1.6–2.2g/kg/day\n3. Small caloric surplus\n4. Adequate sleep\n5. Consistency (months, not days)\nBest lifts: squat, deadlift, bench, pull-ups."},
  {q:["what is protein"],a:"Macronutrient made of amino acids. Essential for: muscle, enzymes, hormones, immune function. Sources: meat, fish, eggs, dairy, legumes. Recommended: 0.8g/kg/day (more if active)."},
  {q:["what is carbohydrates","what are carbs"],a:"Primary energy source. Simple carbs (sugar): fast spike. Complex carbs (oats, whole grains): slow sustained energy. Quality matters more than quantity."},
  {q:["what is fat in food","dietary fat"],a:"Essential: cell membranes, hormones, fat-soluble vitamins.\n• Unsaturated (olive oil, nuts): heart-healthy\n• Saturated (meat, dairy): moderate\n• Trans fat: avoid"},
  {q:["what is caffeine"],a:"Natural stimulant in coffee (95mg/cup), tea, cocoa. Blocks adenosine receptors — reduces fatigue. Half-life ~5 hours. Safe up to ~400mg/day for most adults."},
  {q:["what is sushi"],a:"Japanese dish:\n• Nigiri: rice + fish/seafood on top\n• Maki: rolled in seaweed\n• Sashimi: raw fish, no rice\n• Temaki: hand roll\n• Omakase: chef\'s choice"},
  {q:["what is the most popular food","most eaten food in the world"],a:"Rice is the staple for >half the world\'s population. Wheat and corn are close. Rice is most consumed by number of people fed."},
  {q:["how many calories in a banana"],a:"Medium banana (~118g): ~105 calories, 27g carbs, 14g sugar, 3g fiber. High potassium (422mg). Great pre-workout food."},
  {q:["how many calories in an egg"],a:"Large egg: ~70-80 calories. White: ~17 cal, 3.6g protein. Yolk: ~55 cal, 4.5g fat. Rich in B12, vitamin D, choline."},
  {q:["what is gluten"],a:"Protein in wheat, barley, rye. Most people digest fine. Celiac disease (1% of population): immune reaction damages intestinal lining."},
  {q:["what is veganism"],a:"No animal products: no meat, fish, dairy, eggs, honey. Environmental benefits: lower carbon footprint. Must supplement: B12, iron, omega-3, calcium."},
  {q:["what is coffee"],a:"Brewed from roasted coffee beans. World\'s most popular psychoactive substance (caffeine). Antioxidants. 3–5 cups/day linked to lower risk of type 2 diabetes, Parkinson\'s."},
  {q:["what is alcohol","what is ethanol"],a:"Ethanol = CNS depressant. Short-term: euphoria, impaired judgment. Long-term: liver disease, cancer, addiction. Metabolized ~1 unit/hour."},
  {q:["what is olive oil"],a:"Oil from pressed olives. Main fat in Mediterranean diet. High in monounsaturated fats and antioxidants. Linked to heart health and reduced inflammation."},
  {q:["what is sugar"],a:"Simple carbohydrate providing quick energy. Types: glucose (body\'s fuel), fructose (fruit), sucrose (table sugar). Excess linked to obesity, diabetes, dental decay."},
  {q:["what is fiber"],a:"Indigestible plant carbohydrate. Soluble fiber (oats, beans): lowers cholesterol. Insoluble (whole grains, vegetables): aids digestion. Recommended: 25–38g/day."},
  {q:["what is a mediterranean diet"],a:"Diet based on: olive oil, fish, vegetables, whole grains, legumes, nuts, moderate wine. Strongest scientific evidence for longevity and heart health."},
  {q:["what is the fastest animal"],a:"Land: Cheetah — 112 km/h. Air: Peregrine falcon diving — 389 km/h. Water: Sailfish — 110 km/h."},
  {q:["what is the largest animal"],a:"Blue Whale — up to 33m long, 200 tons. Largest animal ever known, including dinosaurs. Heart the size of a small car."},
  {q:["what is the largest land animal"],a:"African Elephant — up to 7 tons, 4m tall. Also largest brain of any land mammal."},
  {q:["what is the smartest animal"],a:"Besides humans:\n1. Chimpanzees (tool use, complex social)\n2. Dolphins (self-awareness)\n3. Elephants (memory, empathy)\n4. Octopuses (problem-solving)\n5. Crows/Ravens (planning, tool making)"},
  {q:["how long do dogs live"],a:"Average: 10–13 years. Smaller breeds: 15–20 years. Larger breeds: 7–10 years. Oldest verified: Bobi (Portugal) — 31 years."},
  {q:["how long do cats live"],a:"Average domestic: 12–18 years. Indoor cats significantly outlive outdoor cats. Oldest: Creme Puff (Texas) — 38 years."},
  {q:["do fish sleep"],a:"Yes, but differently. Fish enter low-activity, reduced-metabolism states — hovering still, less reactive. No eyelids. Some sharks must keep moving to breathe."},
  {q:["how many species of animals are there"],a:"~8.7 million species estimated. Only ~1.2 million formally described. ~1 million are insects. 6th mass extinction is currently underway."},
  {q:["what is the most venomous animal"],a:"By deaths caused:\n1. Mosquitoes (~1M/year via disease)\n2. Humans (~475K/year)\n3. Snakes (~50K/year)\nMost toxic venom: Box jellyfish, Inland taipan snake."},
  {q:["what is the longest living animal"],a:"Ocean quahog clam: 507 years confirmed. Greenland shark: 400+ years. Turritopsis dohrnii jellyfish: theoretically biologically immortal."},
  {q:["what are mammals"],a:"Warm-blooded vertebrates: nurse young with milk, have hair/fur. ~5,500 species. Examples: humans, whales, bats, dogs, elephants."},
  {q:["what are reptiles"],a:"Cold-blooded vertebrates with scales. Lizards, snakes, crocodilians, turtles. ~10,000 species. Descended from same lineage as birds and dinosaurs."},
  {q:["why are bees important"],a:"Bees pollinate ~75% of flowering plants and ~35% of food crops (almonds, apples, berries). Declining bee populations threaten global food security."},
  {q:["what is a dolphin"],a:"Highly intelligent marine mammals. Live in pods. Echolocation for hunting. Known for: playfulness, self-awareness (mirror test), complex communication, helping humans."},
  {q:["what is an elephant"],a:"Largest land animal. Lifespan 60–70 years. Remarkable memory. Mourn their dead. Matriarchal society. 3 species: African bush, African forest, Asian."},
  {q:["what is a shark"],a:"Cartilaginous fish that have existed for ~450 million years — before dinosaurs. ~500 species. Most are not dangerous. Only ~5–10 human deaths/year globally from sharks."},
  {q:["what is a wolf"],a:"Apex predator and ancestor of all domestic dogs. Live in packs with complex hierarchy. Keystone species — their presence dramatically affects ecosystems (Yellowstone example)."},
  {q:["what is a gorilla"],a:"Largest living primates. Two species: western and eastern gorilla. Share ~98.3% DNA with humans. Endangered. Gentle giants — rarely aggressive."},
  {q:["what is a cheetah"],a:"Fastest land animal (112 km/h). Unlike other big cats, can\'t roar — purrs instead. Endangered: ~7,000 left in wild. Found in Africa and small part of Iran."},
  {q:["what is a penguin"],a:"Flightless seabirds of the Southern Hemisphere (mostly Antarctica). 18 species. Excellent swimmers (up to 36 km/h). Emperor penguins are the largest."},
  {q:["what is an octopus"],a:"8-armed cephalopod. 3 hearts, blue blood. Can change color/texture in milliseconds. Highly intelligent: opens jars, uses tools, plans. Very short lifespan (~1-3 years)."},
  {q:["what is a crocodile"],a:"Ancient reptile: 200+ million years old, barely changed. Strongest bite force of any animal (~3,700 PSI). Saltwater crocodile is largest living reptile."},
  {q:["what is the meaning of life"],a:"Perspectives:\n• Aristotle: eudaimonia — living virtuously and flourishing\n• Camus: create meaning in a meaningless universe\n• Buddhism: end suffering through mindfulness\n• Existentialism: you define your own purpose\n• Douglas Adams: 42 😄\nWhat\'s YOUR answer? 🔥"},
  {q:["what is philosophy"],a:"\'Love of wisdom\' (Greek). Asks: What exists? (metaphysics), How do we know? (epistemology), What is right? (ethics), How should society work? (political philosophy)."},
  {q:["what is ethics"],a:"Study of moral principles. Major theories:\n• Consequentialism (judge by outcomes)\n• Deontology (follow rules, Kant)\n• Virtue ethics (be good, Aristotle)\n• Social contract (Rousseau/Locke)"},
  {q:["what is stoicism"],a:"~300 BC philosophy: focus only on what you control (thoughts, actions). Accept what you cannot. Virtue is the only true good. Marcus Aurelius, Epictetus, Seneca."},
  {q:["what is existentialism"],a:"Existence precedes essence — no predetermined meaning; humans create their own purpose through choices. Sartre, Camus, Nietzsche, Kierkegaard."},
  {q:["what is consciousness"],a:"Subjective experience of being aware. The \'hard problem\': why does brain activity produce subjective experience? Deeply unsolved. One of science\'s greatest mysteries."},
  {q:["what is free will"],a:"Debate:\n• Determinism: all events caused by prior events — no true freedom\n• Libertarian free will: genuine choice\n• Compatibilism: free will and determinism coexist — acting per desires without compulsion"},
  {q:["do aliens exist"],a:"No confirmed evidence. But ~2 trillion galaxies × billions of stars each = statistically life elsewhere seems almost certain. The Fermi Paradox: if so, why haven\'t we heard from them?"},
  {q:["what is time"],a:"Progression from past to present to future. Einstein: time is relative — slows near gravity/high speed. Whether time \'flows\' or all moments coexist (block universe) is debated."},
  {q:["what is reality"],a:"What exists independently of perception. Descartes: doubted everything but his own thinking. Idealism: only minds/ideas exist. Quantum mechanics: observation affects what is real."},
  {q:["what is love"],a:"Ancient Greeks: 8 types:\n• Eros (romantic passion)\n• Philia (friendship)\n• Storge (family)\n• Agape (unconditional)\n• Pragma (mature/enduring)\n• Philautia (self-love)\n• Ludus (playful)\n• Mania (obsessive)"},
  {q:["what is happiness"],a:"Research: 50% genetic set point, 10% circumstances, 40% intentional activities. Drivers: relationships, purpose, engagement, accomplishment, positive emotions (PERMA)."},
  {q:["what is success"],a:"Entirely personal. Frameworks: achievement (goals, wealth), wellbeing (happiness, health), legacy (impact), flow (mastery). Define yours deliberately — or you chase someone else\'s version."},
  {q:["what is mindfulness"],a:"Intentional, non-judgmental attention to the present moment. Reduces anxiety/depression, improves focus, lowers blood pressure. Practice: observe thoughts without attachment."},
  {q:["what is meditation"],a:"Focused attention training. Types: mindfulness, transcendental, guided, loving-kindness. Even 10 min/day measurably changes brain structure (thicker prefrontal cortex)."},
  {q:["what is karma"],a:"From Sanskrit: \'action\' or \'deed.\' In Hinduism/Buddhism: the principle that good/bad actions return to you. Colloquially: \'what goes around comes around.\'"},
  {q:["what is gdp","gross domestic product"],a:"Total monetary value of all goods/services produced in a country per year. USA GDP: ~$27 trillion. World GDP: ~$105 trillion."},
  {q:["what is inflation"],a:"General rise in prices over time, reducing purchasing power. Measured by CPI. Target: ~2%/year. Too high: buying power destroyed. Deflation: also dangerous."},
  {q:["what is capitalism"],a:"Economic system: private ownership, free markets, profit motive. Includes competition, price mechanism. Dominant global system today. Many varieties exist."},
  {q:["what is communism"],a:"Ideology: property publicly owned, people work and receive according to needs. Marx envisioned it as end stage of history. USSR and China attempted versions."},
  {q:["what is socialism"],a:"Social ownership of means of production. Spectrum: democratic socialism (Nordic model) to authoritarian socialism (USSR). Distinct from but related to communism."},
  {q:["what is the stock market"],a:"Where shares of public companies are bought/sold. Major indices: S&P 500 (500 largest US companies), Dow Jones (30 large), Nasdaq (tech-heavy). Long-term avg: ~10%/year."},
  {q:["what is interest rate"],a:"Cost of borrowing money. Set by central banks (Federal Reserve, ECB). Low rates = cheap money = stimulus. High rates = inflation control but economic slowdown."},
  {q:["what is supply and demand"],a:"Fundamental economic law:\n• Higher demand or lower supply → prices rise\n• Lower demand or higher supply → prices fall\nPrices coordinate millions of decisions in market economies."},
  {q:["what is a recession"],a:"Two consecutive quarters of negative GDP growth. Signs: rising unemployment, falling consumer spending. Great Recession (2008–09): worst since Great Depression."},
  {q:["what is tax"],a:"Compulsory payments to government. Types: income, corporation, VAT/sales, capital gains, inheritance. Fund: public services, infrastructure, military, welfare."},
  {q:["what is the federal reserve","what is the fed"],a:"The Federal Reserve = USA\'s central bank. Controls money supply, sets interest rates, regulates banks. Not a government agency — a quasi-public institution."},
  {q:["what is compound interest"],a:"Interest earning interest on previous interest. Einstein called it \'the 8th wonder of the world.\' $1,000 at 10%/year = $17,449 after 30 years. Invest early!"},
  {q:["who is shakespeare"],a:"William Shakespeare (1564–1616) — English playwright, poet. Wrote 37+ plays, 154 sonnets. Famous works: Hamlet, Macbeth, Romeo & Juliet, King Lear. Invented ~1,700 English words."},
  {q:["who painted the mona lisa"],a:"Leonardo da Vinci, ~1503–1519. Oil on poplar wood. Subject: Lisa Gherardini. Hangs in the Louvre, Paris."},
  {q:["who painted the sistine chapel"],a:"Michelangelo painted Sistine Chapel ceiling 1508–1512 and The Last Judgment 1536–1541. Painted lying on scaffolding (not on his back)."},
  {q:["what is the louvre"],a:"World\'s largest and most visited art museum (~9 million visitors/year). Paris. Collections: 480,000 objects including Mona Lisa, Venus de Milo."},
  {q:["who was beethoven"],a:"Ludwig van Beethoven (1770–1827) — continued composing after going deaf. 9 symphonies (Ode to Joy), 32 piano sonatas. One of the greatest composers ever."},
  {q:["who was mozart"],a:"Wolfgang Amadeus Mozart (1756–1791) — Austrian prodigy composing at age 5. Created 800+ works in 35 years: symphonies, operas, concertos. Died at 35."},
  {q:["what is the most popular sport"],a:"Football (soccer) — ~4 billion fans worldwide. FIFA World Cup (~3.5 billion viewers) is the most-watched event on Earth."},
  {q:["who is michael jordan"],a:"Greatest basketball player of all time. Chicago Bulls: 6 NBA championships (1991–93, 1996–98), 6 Finals MVPs, 5 regular season MVPs. 14× All-Star."},
  {q:["who is lebron james"],a:"4× NBA champion, 4× Finals MVP, 4× regular season MVP. All-time NBA scoring leader. Some consider him 2nd greatest, others equal to Jordan."},
  {q:["what is the olympics"],a:"Ancient origins: Greece, 776 BC. Modern revival: Athens 1896. Summer Games every 4 years; Winter 2 years offset. ~200 nations, 10,000+ athletes. Motto: Faster, Higher, Stronger."},
  {q:["what is hip hop"],a:"Born in South Bronx, NYC, early 1970s. 4 elements: rapping, DJing, breakdancing, graffiti. Became world\'s most streamed genre by 2017."},
  {q:["who is pablo picasso"],a:"Pablo Picasso (1881–1973) — Spanish artist, co-founder of Cubism. Guernica (anti-war masterpiece). Most prolific artist in history — 20,000+ works."},
  {q:["who is the beatles"],a:"John Lennon, Paul McCartney, George Harrison, Ringo Starr. Liverpool 1960–1970. Best-selling music act ever. Albums: Abbey Road, Sgt. Pepper\'s, Revolver."},
  {q:["who is michael jackson"],a:"\'King of Pop\' (1958–2009). Best-selling music artist of all time. Thriller: 66–70 million copies sold. Moonwalk. 8 Grammys in one night (1984). 13 #1 singles."},
  {q:["what is the best selling album"],a:"Thriller by Michael Jackson (1982): 66–70 million copies sold. Other top sellers: Back in Black (AC/DC), The Dark Side of the Moon (Pink Floyd)."},
  {q:["who is beyonce"],a:"Beyoncé — most Grammy Awards of all time (32+). Albums: Lemonade, Renaissance. Former Destiny\'s Child. Global icon: performer, businesswoman, cultural force."},
  {q:["who is taylor swift"],a:"Taylor Swift — most-streamed artist on Spotify multiple years. Eras Tour: highest-grossing concert tour in history. Albums: Folklore, 1989, Midnights, Fearless."},
  {q:["who invented jazz"],a:"Jazz emerged in New Orleans early 1900s from African American traditions: blues, ragtime, gospel. Louis Armstrong, Miles Davis, John Coltrane are legends."},
  {q:["what is opera"],a:"Theatrical art: singing, orchestra, acting, staging. Born Florence ~1600. Composers: Mozart, Verdi, Puccini, Wagner. Famous: The Magic Flute, La Traviata, Carmen."},
  {q:["what is the grammy award"],a:"Grammy Awards (Recording Academy) — most prestigious music awards. Annual since 1959. Most Grammy wins: Beyoncé (32+). Most in one night: Michael Jackson (8 in 1984)."},
  {q:["how many languages in the world"],a:"~7,000 languages spoken globally. ~40% endangered. Most spoken (native): Mandarin ~920M, Spanish ~475M, English ~373M. Most total: English ~1.5B."},

  {q:["what is sign language"],a:"Complete natural languages using visual-gestural modality. Not universal — ASL (American), BSL (British), JSL (Japanese) etc. Used by deaf communities worldwide."},
  {q:["what is a dead language"],a:"Language with no native speakers. Latin: died as spoken language by 8th century but lives in law, medicine, science. Others: Sanskrit, Ancient Greek, Gothic, Cornish."},
  {q:["what is the world cup","fifa world cup"],a:"Most-watched sporting event. Held every 4 years since 1930. 32 teams (48 from 2026). Most wins: Brazil (5). 2022: Argentina won in Qatar. 2026: USA/Canada/Mexico hosts."},
  {q:["who has won the most world cups"],a:"Brazil: 5 World Cup titles (1958, 1962, 1970, 1994, 2002). Germany and Italy: 4 each. France: 2. Argentina: 3."},
  {q:["who is messi","lionel messi"],a:"Argentine footballer. 8× Ballon d\'Or. World Cup winner 2022. All-time Champions League record scorer. Played Barcelona 17 years, PSG, now Inter Miami."},
  {q:["who is ronaldo","cristiano ronaldo"],a:"Portuguese footballer. 5× Ballon d\'Or. 5× Champions League winner. All-time international goal scorer (130+ goals). Man United, Real Madrid, Juventus, Al Nassr."},
  {q:["what is the nba"],a:"National Basketball Association — premier basketball league. 30 teams USA/Canada. Most championships: Boston Celtics (18). Stars: LeBron, Curry, Giannis, Jokić."},
  {q:["what is the nfl"],a:"National Football League — premier American football. 32 teams. Super Bowl is most-watched US TV event annually. Tom Brady: 7 Super Bowl wins."},
  {q:["what is the super bowl"],a:"NFL championship game, annually in February. ~100M+ US viewers. Halftime show and commercials are cultural events. Tom Brady won 7 — more than any franchise."},
  {q:["who is usain bolt"],a:"Jamaican sprinter. World records: 100m (9.58s), 200m (19.19s). 8 Olympic gold medals. Greatest sprinter of all time. Retired 2017."},
  {q:["tennis grand slams","what are the grand slams"],a:"4 Grand Slams:\n• Australian Open (January, hard)\n• French Open (May-June, clay)\n• Wimbledon (June-July, grass)\n• US Open (August-September, hard)"},
  {q:["who has the most grand slams"],a:"Men: Novak Djokovic — 24 titles. Rafael Nadal — 22. Roger Federer — 20.\nWomen: Serena Williams — 23. Steffi Graf — 22."},
  {q:["what is formula 1","what is f1"],a:"Highest class open-wheel racing. 20+ races/season, ~20 countries. Cars reach 350+ km/h. Most championships: Lewis Hamilton & Michael Schumacher (7 each)."},
  {q:["who is lewis hamilton"],a:"Sir Lewis Hamilton — British F1 driver. 7× World Champion. 103+ race wins (record). 104 pole positions (record). Known for diversity advocacy and environmentalism."},
  {q:["what is cricket"],a:"Sport played between two teams of 11 with bat and ball. Test cricket lasts up to 5 days. Most popular in: India, England, Australia, Pakistan, West Indies. ICC governs it."},
  {q:["what is basketball","how is basketball played"],a:"5 players per team on court. Score by getting ball through 10-foot hoop. 4 quarters (NBA: 12 min each). Key rules: no traveling, no double dribble, shot clock (24 sec NBA)."},
  {q:["what is tennis"],a:"Sport played with rackets on court (grass, clay, hard). Scoring: 15, 30, 40, game. Must win 6 games to win a set, typically 3 or 5 sets per match."},
  {q:["what is golf"],a:"Sport where players hit a ball into 18 holes in as few strokes as possible. Par = expected strokes per hole. Under par: birdie (-1), eagle (-2). Scored opposite to most sports."},
  {q:["what is rugby"],a:"Contact sport: 15 players per team (Rugby Union) or 13 (Rugby League). Try = 5 points. Conversion = 2 pts. Penalty/drop goal = 3 pts. Rugby World Cup every 4 years."},
  {q:["what is boxing"],a:"Combat sport: two fighters in gloves punching each other in boxing ring. Win by KO, TKO, or judges\' decision. 17 weight classes from strawweight to heavyweight."},
  {q:["what is mma","what is mixed martial arts"],a:"Combat sport combining striking and grappling. UFC is top promotion. Weight classes from strawweight to heavyweight. Can win by KO, TKO, submission, or decision."},
  {q:["what is the tour de france"],a:"World\'s most prestigious cycling race. ~3 weeks, ~21 stages through France (and neighboring countries). ~3,500 km. Winner wears the yellow jersey (maillot jaune). Most wins: Lance Armstrong (stripped) → Eddy Merckx (5)."},
  {q:["what is the highest grossing movie of all time"],a:"Unadjusted box office:\n1. Avatar (2009/2022 re-release): $2.92B\n2. Avengers: Endgame: $2.80B\n3. Titanic: $2.26B\nAdjusted for inflation: Gone with the Wind (1939) tops the list."},
  {q:["what is the best movie ever made"],a:"Critically: Citizen Kane (1941) often tops lists. IMDB users: The Shawshank Redemption. Also: 2001: A Space Odyssey, Vertigo, The Godfather, Schindler\'s List."},
  {q:["what is the oscar award","academy award"],a:"Most prestigious film awards. Presented annually since 1929. Most wins for one film: Ben-Hur, Titanic, Lord of the Rings: Return of the King (11 each)."},
  {q:["what is netflix"],a:"Streaming service. Founded 1997 (DVD-by-mail), pivoted to streaming 2007. 260M+ subscribers. Pioneered binge-watching. Originals: Stranger Things, Squid Game, The Crown."},
  {q:["what is the most watched netflix show"],a:"Squid Game (2021, South Korean) — 111 million households in first 28 days. Also: Wednesday, Stranger Things, Money Heist, The Witcher."},
  {q:["what is global warming"],a:"Long-term rise in Earth\'s temperature due to greenhouse effect amplified by human CO₂ emissions. Since pre-industrial: ~1.1°C rise. Target: below 1.5–2°C."},
  {q:["what is the greenhouse effect"],a:"Sunlight warms Earth → surface emits infrared → greenhouse gases (CO₂, methane) trap that heat. Natural but amplified by humans causing excess warming."},
  {q:["what is the ozone layer"],a:"Stratospheric layer (15–35km up) absorbing most UV radiation. CFCs were destroying it — Montreal Protocol (1987) banned them. Ozone hole is healing."},
  {q:["what is deforestation"],a:"Clearing forests mainly for agriculture and logging. Amazon loses ~10,000 km²/year. Consequences: biodiversity loss, carbon release, disrupted water cycles."},
  {q:["what is renewable energy"],a:"Energy from naturally replenishing sources: solar, wind, hydro, geothermal, tidal. Now cheaper than fossil fuels in most markets. Key to avoiding catastrophic climate change."},
  {q:["what is solar energy"],a:"Converts sunlight → electricity via photovoltaic (PV) cells. Fastest-growing energy source. Costs dropped ~90% in last decade."},
  {q:["what is wind energy"],a:"Wind turbines convert wind kinetic energy → electricity. Onshore wind = among cheapest electricity sources. Denmark generates >40% electricity from wind."},
  {q:["what is a tornado"],a:"Violently rotating air column touching ground, from thunderstorm. Wind speeds up to 480 km/h. \'Tornado Alley\' (Texas to Nebraska) has the most. Rated EF0–EF5."},
  {q:["what is a hurricane","what is a typhoon","what is a cyclone"],a:"All are tropical cyclones with sustained winds >119 km/h. Name depends on location:\n• Atlantic/NE Pacific: Hurricane\n• NW Pacific: Typhoon\n• S Pacific/Indian: Cyclone"},
  {q:["what is an earthquake"],a:"Sudden tectonic plate movement releasing seismic energy. Measured on Richter/moment magnitude scale. Deadliest: 1556 China (830,000 deaths). San Andreas Fault threatens California."},
  {q:["what is a volcano"],a:"Opening in Earth\'s crust where magma, gas, ash escape. Types: shield (gentle, Hawaii), stratovolcano (explosive, Vesuvius). Deadliest eruption: Tambora 1815."},
  {q:["what causes rain","how does rain form"],a:"Water evaporates → rises as vapor → cools at altitude → condenses into clouds → falls when droplets grow heavy enough. The water cycle."},
  {q:["what is the water cycle"],a:"1. Evaporation (water → vapor)\n2. Condensation (vapor → clouds)\n3. Precipitation (rain/snow)\n4. Collection (rivers, lakes, groundwater)\n5. Transpiration (plants release vapor)\n→ Repeat"},
  {q:["what time is it"],a:"I don't have real-time access — your device clock is right there! ⏰"},
  {q:["what is today date","what day is it"],a:"Can't access today's date in real-time — check your phone! 📅"},
  {q:["what is the weather today"],a:"Can't check live weather — try weather.com, Google, or your phone's weather app! ☀️"},
  {q:["how do i lose weight"],a:"Core principle: sustainable calorie deficit.\n1. Track what you eat\n2. Prioritize protein (filling)\n3. Reduce ultra-processed food\n4. Move more\n5. Sleep 7–9 hours (hunger hormones)\n6. Consistency over perfection"},
  {q:["how do i make money"],a:"Key paths:\n• Develop high-value skills (coding, sales, design)\n• Freelance or consult\n• Start a business (solve a real problem)\n• Invest early (compound interest)\n• Negotiate your salary\n\nLong-term: deliver massive value."},
  {q:["how do i learn faster","how to learn better"],a:"Science-backed:\n• Spaced repetition (review at intervals)\n• Active recall (test yourself)\n• Teach others (Feynman technique)\n• Sleep after learning\n• Eliminate multitasking"},
  {q:["how do i start coding","how to start programming"],a:"Best path:\n1. Python first (clearest syntax)\n2. Learn basics: variables, loops, functions\n3. Build small projects immediately\n4. Free resources: CS50, freeCodeCamp, Codecademy\n5. 30 min daily beats 5 hours on weekends"},
  {q:["how do i be more productive"],a:"Top methods:\n• Time blocking\n• Pomodoro (25 min work / 5 min break)\n• Most Important Task first\n• Phone in another room\n• Weekly review\n• Say no to low-value tasks"},
  {q:["how do i improve my english"],a:"Daily habits:\n• Consume English content (podcasts, shows)\n• Speak daily (Tandem, HelloTalk, Cambly)\n• Write in English (journal, social media)\n• Anki for vocabulary\n• Don\'t fear mistakes"},
  {q:["how do i save money"],a:"Core habits:\n• Track spending\n• Pay yourself first\n• 3–6 month emergency fund\n• Cut subscriptions you don\'t use\n• Cook more, eat out less\n• Automate savings"},
  {q:["how do i invest money"],a:"Beginner path:\n1. Emergency fund first (3–6 months)\n2. 401k/pension match (free money)\n3. Index funds (S&P 500): diversified, ~10%/year long-term\n4. Time in market > timing the market\n5. Don\'t panic-sell in downturns"},
  {q:["how do i wake up early"],a:"Tips:\n• Consistent sleep/wake time (including weekends)\n• No screens 30–60 min before bed\n• Cool, dark room\n• Alarm across the room\n• Bright light immediately on waking\n• Gradual shift: 15 min earlier per day"},
  {q:["how to be confident"],a:"Confidence builders:\n• Build competence (confidence follows skill)\n• Small wins daily (momentum)\n• Power posture (stand tall, eye contact)\n• Prepare thoroughly\n• Accept failure as data, not identity"},
  {q:["how to make friends","how to be more social"],a:"Building genuine connections:\n• Show genuine interest (ask, listen)\n• Say yes to invitations\n• Join clubs/groups around interests\n• Be vulnerable (share something real)\n• Follow up after meeting someone"},
  {q:["how to stop procrastinating"],a:"Anti-procrastination:\n• 2-minute rule: <2 min → do it now\n• Eat the frog: hardest task first\n• Reduce friction (open the file, lay out the gear)\n• Time-box: \'just 10 minutes\'\n• Done > perfect"},
  {q:["how to be happy"],a:"Research-backed:\n• Strong relationships (most important)\n• Sense of purpose\n• Regular exercise (endorphins)\n• Gratitude practice (3 things daily)\n• Acts of kindness\n• Enough sleep"},
  {q:["what is a good salary"],a:"Relative to location/lifestyle. USA median household: ~$75,000/year. More important: savings rate and investment habit. Financial independence > high salary."},
  {q:["how do i negotiate salary"],a:"Tips:\n• Research market rate (Glassdoor, Levels.fyi)\n• Let them give first number if possible\n• Anchor high (10–20% above target)\n• Justify with value/market data\n• Always negotiate — worst answer is no"},
  {q:["how do i start a business"],a:"Steps:\n1. Identify a real problem\n2. Validate (talk to potential customers first)\n3. Build MVP (minimum viable product)\n4. Get first 10 paying customers\n5. Iterate on feedback\n6. Don\'t quit day job until revenue proves it"},
  {q:["how to write a resume"],a:"Resume essentials:\n• 1 page (unless 10+ years)\n• Quantify achievements (\'increased revenue 23%\' not \'managed team\')\n• Tailor to each job description\n• ATS-friendly formatting\n• Skills matching job requirements"},
  {q:["how to write a cover letter"],a:"Formula:\n1. Why this company + role\n2. 2–3 specific achievements showing you can do the job\n3. Enthusiasm + call to action\n\nKeep to 1 page. Customize every application."},
  {q:["how does the brain work"],a:"~86 billion neurons, each connected to ~7,000 others. Uses 20% of body\'s energy despite being 2% of body weight. Key regions: frontal lobe (decisions), hippocampus (memory), amygdala (emotion)."},
  {q:["how does memory work"],a:"Short-term: seconds to minutes. Long-term: declarative (facts) + procedural (skills). Formation: neurons that fire together wire together. Sleep consolidates memories. Emotion enhances memory."},
  {q:["why do we dream"],a:"Theories:\n• Memory consolidation\n• Threat simulation (evolutionary)\n• Emotional processing\n• Random neural firing (Activation-Synthesis theory)\nTrue reason: still debated and mysterious."},
  {q:["how does the eye work"],a:"Light → cornea → pupil → lens → retina (rods: low light; cones: color/detail) → optic nerve → visual cortex. Brain processes ~90% of what we \'see.\'"},
  {q:["how does digestion work"],a:"Food journey:\nMouth (chew+amylase) → Esophagus → Stomach (acid, 4 hrs) → Small intestine (nutrients absorbed) → Large intestine (water absorbed) → Exit\nTotal: 24–72 hours"},
  {q:["how does gps work"],a:"24+ satellites at ~20,200 km orbit. Your device receives signals from 4+, calculates distance from travel time, triangulates position. Accurate to ~5 meters civilian."},
  {q:["how does wifi work"],a:"Router converts internet data to radio waves (2.4 or 5 GHz). Device\'s Wi-Fi adapter receives/decodes them. Range: typically 30–50m indoors."},
  {q:["how does a battery work"],a:"Chemical energy → electrical energy. Anode (-): oxidation releases electrons. Cathode (+): accepts electrons. Electron flow through circuit = current. Li-ion (phones/EVs) are rechargeable."},
  {q:["how do planes fly"],a:"Wings (airfoil shape) make air travel faster over top → lower pressure above → lift generated upward. Engines provide thrust to overcome drag. A 747 generates ~900,000 lbs of lift."},
  {q:["what killed the dinosaurs"],a:"~66 million years ago: ~10-15 km asteroid hit Yucatan Peninsula. Released energy of 10 billion Hiroshima bombs. Triggered fires, nuclear winter, acidified oceans. 75% of species extinct."},
  {q:["what came before dinosaurs"],a:"Timeline:\n• 3.8B years ago: First life (microbes)\n• 540M: Cambrian explosion\n• 375M: First land vertebrates\n• 252M: Permian extinction (96% of species)\n• 230–66M: Dinosaurs\n• 66M: Asteroid impact → mammals diversified"},
  {q:["how old is the human race","when did humans appear"],a:"Anatomically modern Homo sapiens: ~300,000 years ago in Africa. Behaviorally modern (art, tools): ~50,000–70,000 years ago. Left Africa: ~60,000–70,000 years ago."},
  {q:["how old are trees","oldest tree"],a:"Oldest living tree: Bristlecone pine \'Methuselah\' — 4,855 years old, California. Oldest clonal organism: Pando (aspen grove, Utah) — ~80,000 years."},
  {q:["what is the most common element in the universe"],a:"Hydrogen — ~75% of all normal matter. Second: Helium (~24%). Together: 99% of all atomic matter."},
  {q:["what is the hottest planet"],a:"Venus — not Mercury! Thick CO₂ atmosphere creates runaway greenhouse effect. Surface: ~465°C (869°F) constantly — hot enough to melt lead."},
  {q:["how many stars in the milky way"],a:"Estimated 100–400 billion stars. Our sun is just one of them."},
  {q:["nearest star to earth","closest star"],a:"Proxima Centauri — 4.24 light years away (40 trillion km). Alpha Centauri A/B: 4.37 light years."},
  {q:["what percent dna do humans share with chimps"],a:"~98.7% of DNA coding sequence. Also: ~85% with mice, ~60% with fruit flies, ~50% with bananas!"},

// SMART ANSWER ENGINE
function getAnswer(raw) {
  const q = raw.toLowerCase().trim().replace(/[?!.,;]/g,'');
  if (!q) return "Ask me something! 🔥";

  // Direct match
  for (const e of QA) {
    for (const k of e.q) {
      if (q === k || q.includes(k) || k.includes(q)) return e.a;
    }
  }

  // Keyword scoring
  const words = q.split(/\s+/).filter(w => w.length > 2);
  let best = 0, ans = null;
  for (const e of QA) {
    for (const k of e.q) {
      const kw = k.split(/\s+/);
      let score = 0;
      for (const w of words) if (kw.includes(w)) score += w.length > 4 ? 2 : 1;
      if (score > best) { best = score; ans = e.a; }
    }
  }
  if (best >= 3) return ans;

  // Math fallback
  const m = q.replace(/what is|calculate|solve|compute/g,'').trim();
  if (/^[\d\s\+\-\*\/\^\(\)\.x%]+$/.test(m) && m.length > 0) {
    try {
      const r = Function('"use strict";return('+m.replace(/x/gi,'*').replace(/\^/g,'**')+')')();
      if (!isNaN(r) && isFinite(r)) return m.trim() + ' = ' + r + ' 🔥';
    } catch(e) {}
  }

  // Helpful topic hints
  if (q.includes('capital of') || q.includes('capital city')) return "I know most world capitals! Try: 'What is the capital of [country]?' 🌍";
  if (q.includes('how to') || q.includes('how do i') || q.includes('how can i')) return "Good how-to question! Be a bit more specific. 🔥 Try: 'How do I [specific thing]?'";
  if (q.includes('who invented') || q.includes('who created')) return "I know many inventors! Try: 'Who invented [thing]?' 🔥";
  if (q.includes('when did') || q.includes('what year')) return "Try: 'When did [event] happen?' I know lots of history! 📜";
  if (q.includes('what is') || q.includes('what are')) return "Try rephrasing with more specific terms — I cover science, math, history, coding, health, geography, philosophy, sport, music, culture and much more. 🔥";
  if (q.includes('who is') || q.includes('who was')) return "I know many famous people! Be more specific — name the person you want to know about. 🔥";
  if (q.includes('why ')) return "Great 'why' question! Give me a bit more context. 🔥";
  if (q.includes('where ')) return "Location question? Try: 'What is the capital of [country]?' 🌍";
  if (q.includes('code') || q.includes('program')) return "Coding question! Try: 'How do I write a for loop in Python?' 💻";
  if (q.includes('recipe') || q.includes('cook') || q.includes('food')) return "Food question! Try: 'What is [dish]?' or 'How many calories in [food]?' 🍽️";
  return "🔥 Madfire has " + QA.length + "+ entries but doesn't have that exact one yet. Try rephrasing! I cover: science, math, history, geography, coding, health, food, animals, sports, music, movies, philosophy, language, economics and much more.";
}

// UI
const msgs = document.getElementById('msgs');
const inp  = document.getElementById('ui');
const btn  = document.getElementById('sb');
const sc   = document.getElementById('sc');
const qc   = document.getElementById('qc');

qc.textContent = QA.length + ' topics 🔥';

SUGS.forEach(s => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = s;
  b.addEventListener('click', () => send(s));
  sc.appendChild(b);
});

addMsg('a', "I'm Madfire 🔥 — your blazing AI with " + QA.length + "+ topic entries covering science, math, history, geography, coding, health, food, animals, sports, music, philosophy, economics, language, space and much more.\n\nPick a suggestion below or ask me anything!", 0);

function fmt(ms) { return ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(2) + 's'; }

function addMsg(role, text, timer) {
  const row = document.createElement('div');
  row.className = 'mr ' + role;
  if (role === 'a') {
    const av = document.createElement('div');
    av.className = 'av'; av.textContent = '🔥';
    row.appendChild(av);
  }
  const wrap = document.createElement('div');
  wrap.className = 'mw';
  if (role === 'a') {
    const meta = document.createElement('div');
    meta.className = 'mm';
    const nm = document.createElement('span');
    nm.className = 'mn'; nm.textContent = 'MADFIRE';
    meta.appendChild(nm);
    if (timer > 0) {
      const tb = document.createElement('span');
      tb.className = 'tb'; tb.textContent = '⚡ ' + fmt(timer);
      meta.appendChild(tb);
    }
    wrap.appendChild(meta);
  }
  const bub = document.createElement('div');
  bub.className = 'b ' + role;
  bub.textContent = text;
  wrap.appendChild(bub);
  row.appendChild(wrap);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function send(text) {
  const q = (text !== undefined ? text : inp.value).trim();
  if (!q) return;
  inp.value = ''; inp.style.height = 'auto';
  btn.disabled = true;
  addMsg('u', q, 0);
  const t0 = Date.now();
  setTimeout(() => {
    addMsg('a', getAnswer(q), Date.now() - t0);
  }, 40 + Math.random() * 100);
}

inp.addEventListener('input', () => {
  btn.disabled = !inp.value.trim();
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
});
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
btn.addEventListener('click', () => send());
</script>
