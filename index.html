// ── FIRE CANVAS ────────────────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('fireCanvas');
  const ctx = canvas.getContext('2d');
  let animId;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = 220;
  function mkP(born) {
    return {
      x: Math.random() * canvas.width,
      y: born ? canvas.height + 20 : canvas.height - Math.random() * canvas.height * 0.85,
      vx: (Math.random() - 0.5) * 1.4,
      vy: -(Math.random() * 4 + 2),
      life: Math.random() * 0.65 + 0.35,
      ml: 1,
      sz: Math.random() * 24 + 7
    };
  }
  const ps = Array.from({ length: COUNT }, () => mkP(false));

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bg.addColorStop(0,    '#020002');
    bg.addColorStop(0.65, '#090001');
    bg.addColorStop(1,    '#1c0400');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const eg = ctx.createRadialGradient(canvas.width/2, canvas.height, 0, canvas.width/2, canvas.height, canvas.width * 0.65);
    eg.addColorStop(0,    'rgba(255,65,0,0.25)');
    eg.addColorStop(0.45, 'rgba(200,20,0,0.1)');
    eg.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = eg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = 'screen';
    const now = Date.now() * 0.001;

    ps.forEach(p => {
      p.x += p.vx + Math.sin(now + p.y * 0.009) * 0.6;
      p.y += p.vy;
      p.vy -= 0.038;
      p.life -= 0.011;
      p.sz *= 0.9935;
      if (p.life <= 0 || p.y < -80) Object.assign(p, mkP(true));

      const a = Math.max(0, p.life / p.ml);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.sz);
      g.addColorStop(0,   `rgba(255,${Math.floor(a*200+30)},15,1)`);
      g.addColorStop(0.4, `rgba(255,${Math.floor(a*90)},0,0.7)`);
      g.addColorStop(1,   'rgba(60,0,0,0)');
      ctx.globalAlpha = a * 0.88;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    animId = requestAnimationFrame(tick);
  }
  tick();
})();

// ── SMART ANSWER ENGINE ────────────────────────────────────────────────────────
function getAnswer(userInput) {
  const raw = userInput.toLowerCase().trim().replace(/[?!.,]/g, '');

  // Direct / contains match
  for (const entry of QA) {
    for (const q of entry.q) {
      if (raw === q || raw.includes(q) || q.includes(raw)) return entry.a;
    }
  }

  // Keyword scoring
  const words = raw.split(/\s+/);
  let bestScore = 0, bestAnswer = null;
  for (const entry of QA) {
    for (const q of entry.q) {
      const qWords = q.split(/\s+/);
      let score = 0;
      for (const w of words) if (w.length > 2 && qWords.includes(w)) score++;
      if (score > bestScore) { bestScore = score; bestAnswer = entry.a; }
    }
  }
  if (bestScore >= 2) return bestAnswer;

  // Math fallback
  if (/^[\d\s\+\-\*\/\^\(\)\.x]+$/.test(raw)) {
    try {
      const expr = raw.replace(/x/g,'*').replace(/\^/g,'**');
      const result = Function('"use strict";return('+expr+')')();
      if (!isNaN(result)) return raw + ' = ' + result + ' 🔥';
    } catch(e) {}
  }

  // Helpful redirects
  if (raw.includes('capital of')) return "Try: \"What is the capital of [country]?\" — I know most of them! 🌍";
  if (raw.includes('how to') || raw.includes('how do i')) return "Good how-to! Be a little more specific and I'll fire back the answer. 🔥";
  if (raw.includes('what is') || raw.includes('what are')) return "Interesting! Try rephrasing — I cover science, math, history, tech, health, coding and much more.";
  if (raw.includes('who is') || raw.includes('who was')) return "I know many famous figures. Be more specific and I'll burn through the answer! 🔥";
  if (raw.includes('why')) return "Great 'why' question! Give me a bit more context.";
  if (raw.includes('when')) return "For dates, try: 'When did WW2 end?' or 'When was [event]?' 📅";
  if (raw.includes('where')) return "Geography question? Try: 'What is the capital of [country]?' or 'Where is [place]?' 🌍";
  if (raw.includes('code') || raw.includes('program')) return "Coding question! Try: 'How do I print hello world in Python?' or 'What is a for loop?' 💻";

  return "🔥 Madfire doesn't have that exact answer yet — try rephrasing! I know science, math, history, geography, coding, health, philosophy, food, animals, and much more.";
}

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('userInput');
const sendBtn    = document.getElementById('sendBtn');
const sugsEl     = document.getElementById('suggestions');
const qaCountEl  = document.getElementById('qaCount');

qaCountEl.textContent = (QA.length * 3) + '+ Q&As loaded';

// Render suggestion chips
SUGGESTIONS.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.textContent = s;
  btn.addEventListener('click', () => send(s));
  sugsEl.appendChild(btn);
});

// Welcome message
addMsg('ai', "I'm Madfire 🔥 — your blazing AI. I can answer almost anything: science, math, history, coding, health, philosophy, and more.\n\nPick a question below or type your own!", 0);

function fmtMs(ms) { return ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(2) + 's'; }

function addMsg(role, text, timer) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  if (role === 'ai') {
    const avatar = document.createElement('div');
    avatar.className = 'ai-avatar';
    avatar.textContent = '🔥';
    row.appendChild(avatar);
  }

  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';

  if (role === 'ai') {
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = 'MADFIRE';
    meta.appendChild(name);
    if (timer > 0) {
      const badge = document.createElement('span');
      badge.className = 'timer-badge';
      badge.textContent = '⚡ ' + fmtMs(timer);
      meta.appendChild(badge);
    }
    wrap.appendChild(meta);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + role;
  bubble.textContent = text;
  wrap.appendChild(bubble);
  row.appendChild(wrap);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function send(text) {
  const q = (text || inputEl.value).trim();
  if (!q) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  addMsg('user', q, 0);
  const t0 = Date.now();
  setTimeout(() => {
    const answer = getAnswer(q);
    addMsg('ai', answer, Date.now() - t0);
  }, 60 + Math.random() * 140);
}

inputEl.addEventListener('input', () => {
  sendBtn.disabled = !inputEl.value.trim();
  // Auto-resize
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

sendBtn.addEventListener('click', () => send());
</script>
